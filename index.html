<!doctype html>
<!-- data-theme seleciona o theme pack; `chocolate-dark` é o default (ticket 045
     — substitui o pack roxo `resume`, aposentado). O script inline abaixo roda
     antes de qualquer paint e só troca para `chocolate` se o visitante já
     tiver escolhido claro antes (localStorage) — sem isso o toggle do header
     piscaria escuro por um frame a cada reload. Migra o valor legado `resume`
     salvo por quem visitou antes do ticket 045 para o novo default. -->
<html lang="en" data-theme="chocolate-dark">
  <head>
    <script>
      (function () {
        var saved = localStorage.getItem('theme')
        if (saved === 'resume') {
          saved = 'chocolate-dark'
          localStorage.setItem('theme', saved)
        }
        if (saved === 'chocolate') document.documentElement.setAttribute('data-theme', 'chocolate')
      })()
    </script>
